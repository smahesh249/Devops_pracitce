name: Infra Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Choose the environment to destroy"
        required: true
        type: choice
        options:
          - production
      confirm_destroy:
        description: "Type destroy to confirm"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"

jobs:
  terraform-plan-destroy:
    name: Terraform Destroy Plan
    if: inputs.confirm_destroy == 'destroy'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ./

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform initialize
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Check Terraform state
        run: |
          terraform state list

      - name: Terraform destroy plan
        run: terraform plan -destroy -input=false -out=destroy.tfplan

      - name: Display destroy plan
        run: terraform show destroy.tfplan

      - name: Upload destroy plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-destroy-plan
          path: ./destroy.tfplan
          if-no-files-found: error
          retention-days: 1

  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    needs: terraform-plan-destroy
    environment: ${{ inputs.environment }}

    if: inputs.confirm_destroy == 'destroy'

    defaults:
      run:
        shell: bash
        working-directory: ./

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform initialize
        run: terraform init -input=false

      - name: Download destroy plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-destroy-plan
          path: ./

      - name: Apply destroy plan
        run: terraform apply -input=false -auto-approve destroy.tfplan