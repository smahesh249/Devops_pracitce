```yaml
name: Infra Destroy

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type destroy to confirm"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"

jobs:
  destroy:
    if: inputs.confirm_destroy == 'destroy'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ./

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Initialize Terraform
        run: terraform init -input=false -reconfigure

      - name: Check Terraform state
        run: |
          terraform workspace show
          terraform state list

      - name: Create destroy plan
        run: terraform plan -destroy -input=false -out=destroy.tfplan

      - name: Stop if plan is empty
        run: |
          terraform show -json destroy.tfplan > destroy.json
          COUNT=$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' destroy.json)
          echo "Resources planned for deletion: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "No resources are tracked for destruction. Stopping safely."
            exit 1
          fi

      - name: Show destroy plan
        run: terraform show destroy.tfplan

      - name: Destroy infrastructure
        run: terraform apply -input=false -auto-approve destroy.tfplan
```
